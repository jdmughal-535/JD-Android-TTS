pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // TAndroidLame (LAME MP3 encoder) is published via JitPack only.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "JD-Android-TTS"
include ':app'

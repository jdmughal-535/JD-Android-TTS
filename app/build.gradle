plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// sherpa-onnx AAR: k2-fsa publishes no Maven artifact, only a GitHub
// release AAR. It is downloaded on first build (~48 MB) and NOT committed,
// so the repository stays light. Version 1.13.6 already contains
// Supertonic 3 support (added in 1.12.29).
def sherpaVersion = "1.13.6"
def sherpaAar = layout.projectDirectory.file("libs/sherpa-onnx-${sherpaVersion}.aar").asFile

tasks.register("fetchSherpaOnnx") {
    description = "Downloads the sherpa-onnx Android AAR if it is not present."
    outputs.file(sherpaAar)
    onlyIf { !sherpaAar.exists() }
    doLast {
        sherpaAar.parentFile.mkdirs()
        def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/" +
                "v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar"
        logger.lifecycle("Downloading sherpa-onnx ${sherpaVersion} (~48 MB)...")
        // NOTE: Groovy, not Kotlin — use withStream/withOutputStream, NOT
        // .use { } (Groovy reads that as the category method and fails with
        // "Expecting at least 2 arguments, a category class and a Closure").
        sherpaAar.withOutputStream { out ->
            uri(url).toURL().openStream().withStream { input ->
                out << input
            }
        }
        logger.lifecycle("Downloaded ${sherpaAar.name} (${sherpaAar.length()} bytes)")
    }
}
tasks.named("preBuild") { dependsOn(fetchSherpaOnnx) }

android {
    namespace 'com.jdmughal.androidtts'
    compileSdk 36

    defaultConfig {
        applicationId "com.jdmughal.androidtts"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    // sherpa-onnx AAR, fetched by the fetchSherpaOnnx task above.
    implementation files("libs/sherpa-onnx-1.13.6.aar")

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.15.0'

    // Tar + bzip2 extraction for the Supertonic model download (.tar.bz2).
    implementation 'org.apache.commons:commons-compress:1.26.2'

    // LAME MP3 encoder (prebuilt AAR with arm64-v8a + armeabi-v7a + x86
    // + x86_64 .so, via JitPack) — saving audio as MP3 128k instead of
    // WAV, so files stay small. Android has no built-in MP3 encoder.
    // The library drags in the old com.android.support:support-compat
    // (26.1.0), whose android.support.v4 classes duplicate androidx —
    // exclude it: the library's own code never references it.
    implementation('com.github.naman14:TAndroidLame:1.1') {
        exclude group: 'com.android.support'
    }
}
